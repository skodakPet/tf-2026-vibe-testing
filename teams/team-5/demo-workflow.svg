<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Team 5 demo workflow: phase 1 extracts features from the spec and a human decides for each new one whether it is a core feature; phase 2 covers every feature without linked tests with the Playwright planner and generator agents; core-features.md is the shared memory of both phases.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,700;1,400&amp;family=Bungee&amp;family=JetBrains+Mono&amp;display=swap');
    text { font-family: 'Rubik', 'Helvetica Neue', Arial, sans-serif; fill: #000; }
    .h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
    .sub { font-size: 18px; font-style: italic; fill: #4d4d4d; }
    .k { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; }
    .t { font-size: 18px; font-weight: 700; }
    .d { font-size: 14px; fill: #333; }
    .s { font-size: 12px; fill: #595959; }
    .m { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
    .w { fill: #fff; }
    .g { fill: #cfcfcf; }
    .y { fill: #ffcc00; }
    .arrow { stroke: #000; stroke-width: 3; fill: none; }
    .thin { stroke: #000; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .badge circle { fill: #ffcc00; stroke: #000; stroke-width: 2; }
    .badge text { font-size: 15px; font-weight: 700; }
    .badge.dark circle { fill: #000; stroke: #ffcc00; }
    .badge.dark text { fill: #ffcc00; }
    .row { font-size: 13px; }
    .th { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; fill: #595959; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" />
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#fff" />

  <!-- title, with the slides' yellow highlighter under the key words -->
  <rect x="350" y="62" width="30" height="13" fill="#ffcc00" />
  <rect x="599" y="62" width="58" height="13" fill="#ffcc00" />
  <text x="40" y="72" class="h1">Člověk rozhoduje <tspan>co</tspan>, agent dělá <tspan>jak</tspan></text>
  <text x="40" y="104" class="sub">Team 5 · dva skills, jeden soubor jako paměť</text>

  <!-- ============ header row ============ -->
  <rect x="40" y="140" width="380" height="50" rx="6" fill="#000" />
  <text x="58" y="161" class="k y">FÁZE 1 · DISCOVER</text>
  <text x="58" y="180" class="m w">run team-5-discover-features</text>

  <rect x="860" y="140" width="380" height="50" rx="6" fill="#000" />
  <text x="878" y="161" class="k y">FÁZE 2 · COVER</text>
  <text x="878" y="180" class="m w">run team-5-cover-features</text>

  <line x1="422" y1="165" x2="856" y2="165" class="arrow dash" marker-end="url(#a)" />
  <rect x="540" y="152" width="200" height="26" rx="13" fill="#ffcc00" stroke="#000" stroke-width="2" />
  <text x="640" y="170" class="d" text-anchor="middle" style="font-weight:700;fill:#000">krok 5 · ano → pokračuj</text>

  <!-- ============ phase 1 · discover ============ -->
  <g>
    <rect x="40" y="210" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="40" y="210" width="380" height="5" fill="#ffcc00" />
    <text x="58" y="240" class="t">Načti spec</text>
    <text x="58" y="266" class="m">spec/foodora-spec.md + spec/battle/</text>
    <g class="badge"><circle cx="398" cy="234" r="14" /><text x="398" y="239" text-anchor="middle">1</text></g>
  </g>
  <line x1="230" y1="286" x2="230" y2="304" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="40" y="306" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="40" y="306" width="380" height="5" fill="#ffcc00" />
    <text x="58" y="336" class="t">Identifikuj features</text>
    <text x="58" y="362" class="d">1 story FD-xx = 1 feature</text>
    <g class="badge"><circle cx="398" cy="330" r="14" /><text x="398" y="335" text-anchor="middle">2</text></g>
  </g>
  <line x1="230" y1="382" x2="230" y2="400" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="40" y="402" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="40" y="402" width="380" height="5" fill="#ffcc00" />
    <text x="58" y="432" class="t">Porovnej s as-is stavem</text>
    <text x="58" y="458" class="d">je FD-xx už v core-features.md?</text>
    <g class="badge"><circle cx="398" cy="426" r="14" /><text x="398" y="431" text-anchor="middle">3</text></g>
  </g>
  <line x1="230" y1="478" x2="230" y2="496" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="40" y="498" width="380" height="76" rx="6" fill="#ffcc00" />
    <text x="58" y="518" class="k">HITL · ČLOVĚK ROZHODNE</text>
    <text x="58" y="542" class="t">Je FD-xx core feature?</text>
    <text x="58" y="564" class="d">ano / ne → zapiš · ↺ pro každou novou</text>
    <g class="badge dark"><circle cx="398" cy="522" r="14" /><text x="398" y="527" text-anchor="middle">4</text></g>
  </g>
  <line x1="230" y1="574" x2="230" y2="592" class="arrow" marker-end="url(#a)" />
  <!-- loop: next feature -->
  <polyline points="40,552 24,552 24,440 36,440" class="thin" marker-end="url(#a)" />

  <g>
    <rect x="40" y="594" width="380" height="76" rx="6" fill="#ffcc00" />
    <text x="58" y="614" class="k">HITL · ČLOVĚK ROZHODNE</text>
    <text x="58" y="638" class="t">Pokrýt nové core features testy?</text>
    <text x="58" y="660" class="d">ano → Fáze 2 ↗ · ne → konec, jen report</text>
    <g class="badge dark"><circle cx="398" cy="618" r="14" /><text x="398" y="623" text-anchor="middle">5</text></g>
  </g>

  <!-- ============ middle · core-features.md ============ -->
  <g>
    <rect x="480" y="210" width="320" height="340" rx="10" fill="#fff" stroke="#000" stroke-width="3" />
    <rect x="480" y="210" width="320" height="30" rx="10" fill="#000" />
    <rect x="480" y="226" width="320" height="14" fill="#000" />
    <circle cx="498" cy="225" r="5" fill="#ffcc00" />
    <circle cx="514" cy="225" r="5" fill="#ffcc00" />
    <circle cx="530" cy="225" r="5" fill="#ffcc00" />
    <text x="548" y="230" class="m w">core-features.md</text>

    <text x="498" y="268" class="th">ID</text>
    <text x="566" y="268" class="th">CORE</text>
    <text x="626" y="268" class="th">TEST IDS</text>
    <text x="722" y="268" class="th">STATUS</text>
    <line x1="496" y1="278" x2="784" y2="278" stroke="#000" stroke-width="1.5" />

    <text x="498" y="304" class="row m">FD-05</text>
    <text x="566" y="304" class="row">—</text>
    <text x="626" y="304" class="row">3 testy</text>
    <rect x="720" y="290" width="50" height="20" rx="4" fill="#000" />
    <text x="745" y="305" class="row w" text-anchor="middle" style="font-weight:700">PASS</text>
    <line x1="496" y1="318" x2="784" y2="318" stroke="#e0e0e0" />

    <text x="498" y="344" class="row m">FD-09</text>
    <text x="566" y="344" class="row">ano</text>
    <text x="626" y="344" class="row">2 testy</text>
    <rect x="720" y="330" width="50" height="20" rx="4" fill="#ffcc00" stroke="#000" stroke-width="1.5" />
    <text x="745" y="345" class="row" text-anchor="middle" style="font-weight:700">BUG</text>
    <line x1="496" y1="358" x2="784" y2="358" stroke="#e0e0e0" />

    <text x="498" y="384" class="row m">FD-10</text>
    <text x="566" y="384" class="row">ne</text>
    <text x="626" y="384" class="row s">nepokrývá se</text>
    <text x="722" y="384" class="row s">—</text>
    <line x1="496" y1="398" x2="784" y2="398" stroke="#e0e0e0" />

    <rect x="490" y="404" width="300" height="34" rx="4" fill="#fff4c2" />
    <text x="498" y="426" class="row m">FD-11</text>
    <text x="566" y="426" class="row">ano</text>
    <text x="626" y="426" class="row" style="font-weight:700">prázdné →</text>
    <text x="722" y="426" class="row" style="font-weight:700">Fáze 2</text>

    <text x="498" y="474" class="s">Core: — as-is · ano / ne z HITL</text>
    <text x="498" y="494" class="s">Status: PASS · BUG (app ≠ spec, test červený)</text>
    <text x="498" y="514" class="s">· FAIL (test nejde rozchodit)</text>
    <text x="498" y="536" class="s" style="font-style:italic">zápis hned po každé feature</text>
  </g>

  <!-- dashboard -->
  <g>
    <rect x="480" y="594" width="320" height="76" rx="6" fill="#f2f2f2" />
    <rect x="480" y="594" width="320" height="5" fill="#ffcc00" />
    <text x="498" y="620" class="k">DASHBOARD</text>
    <text x="498" y="642" class="m" style="font-weight:700">playwright-report/index.html</text>
    <text x="498" y="661" class="d">celá suite po poslední feature</text>
  </g>

  <!-- phase 1 ↔ core-features.md -->
  <line x1="478" y1="440" x2="424" y2="440" class="arrow" marker-end="url(#a)" />
  <text x="451" y="432" class="s" text-anchor="middle">čte</text>
  <line x1="422" y1="530" x2="476" y2="530" class="arrow" marker-end="url(#a)" />
  <text x="451" y="522" class="s" text-anchor="middle">zapíše</text>

  <!-- ============ phase 2 · cover ============ -->
  <g>
    <rect x="860" y="210" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="860" y="210" width="380" height="5" fill="#ffcc00" />
    <text x="878" y="240" class="t">Najdi nepokrytou feature</text>
    <text x="878" y="266" class="d">bez Test IDs a Core ≠ ne</text>
    <g class="badge"><circle cx="1218" cy="234" r="14" /><text x="1218" y="239" text-anchor="middle">6</text></g>
  </g>
  <line x1="1050" y1="286" x2="1050" y2="304" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="860" y="306" width="380" height="76" rx="6" fill="#000" />
    <text x="878" y="332" class="k y">PLAYWRIGHT AGENT · PLANNER</text>
    <text x="878" y="356" class="t w">Naplánuj pravidla ze spec</text>
    <text x="878" y="374" class="m g">specs/FD-xx.md</text>
    <g class="badge"><circle cx="1218" cy="330" r="14" /><text x="1218" y="335" text-anchor="middle">7</text></g>
  </g>
  <line x1="1050" y1="382" x2="1050" y2="400" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="860" y="402" width="380" height="76" rx="6" fill="#000" />
    <text x="878" y="428" class="k y">PLAYWRIGHT AGENT · GENERATOR</text>
    <text x="878" y="452" class="t w">Test na každé pravidlo</text>
    <text x="878" y="470" class="m g">test('FD-xx · pravidlo')</text>
    <g class="badge"><circle cx="1218" cy="426" r="14" /><text x="1218" y="431" text-anchor="middle">8</text></g>
  </g>
  <line x1="1050" y1="478" x2="1050" y2="496" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="860" y="498" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="860" y="498" width="380" height="5" fill="#ffcc00" />
    <text x="878" y="526" class="t">Spusť test</text>
    <text x="1000" y="526" class="m">npx playwright test</text>
    <rect x="878" y="542" width="50" height="20" rx="4" fill="#000" />
    <text x="903" y="557" class="row w" text-anchor="middle" style="font-weight:700">PASS</text>
    <rect x="936" y="542" width="50" height="20" rx="4" fill="#ffcc00" stroke="#000" stroke-width="1.5" />
    <text x="961" y="557" class="row" text-anchor="middle" style="font-weight:700">BUG</text>
    <rect x="994" y="542" width="50" height="20" rx="4" fill="#cfcfcf" />
    <text x="1019" y="557" class="row" text-anchor="middle" style="font-weight:700">FAIL</text>
    <text x="1054" y="557" class="s">chyba testu → oprava ≤ 2×</text>
    <g class="badge"><circle cx="1218" cy="522" r="14" /><text x="1218" y="527" text-anchor="middle">9</text></g>
  </g>
  <line x1="1050" y1="574" x2="1050" y2="592" class="arrow" marker-end="url(#a)" />

  <g>
    <rect x="860" y="594" width="380" height="76" rx="6" fill="#f2f2f2" />
    <rect x="860" y="594" width="380" height="5" fill="#ffcc00" />
    <text x="878" y="624" class="t">Zapiš výsledek</text>
    <text x="878" y="650" class="d">Test IDs + Status · ↺ další feature</text>
    <g class="badge"><circle cx="1218" cy="618" r="14" /><text x="1218" y="623" text-anchor="middle">10</text></g>
  </g>
  <!-- loop: next feature -->
  <polyline points="1240,632 1258,632 1258,248 1244,248" class="thin" marker-end="url(#a)" />

  <!-- phase 2 ↔ core-features.md -->
  <line x1="802" y1="248" x2="856" y2="248" class="arrow" marker-end="url(#a)" />
  <text x="829" y="240" class="s" text-anchor="middle">čte</text>
  <polyline points="858,612 830,612 830,500 804,500" class="arrow" marker-end="url(#a)" />
  <text x="822" y="556" class="s" text-anchor="middle" transform="rotate(-90 822 556)">zapíše</text>
  <line x1="858" y1="652" x2="804" y2="652" class="arrow dash" marker-end="url(#a)" />
  <text x="831" y="644" class="s" text-anchor="middle">konec</text>

  <!-- footer -->
  <text x="40" y="704" class="s">🟨 HITL · rozhoduje člověk    ⬛ Playwright agent    ⬜ krok skillu</text>
  <text x="1240" y="704" class="s" text-anchor="end">Team 5 · tf-2026-vibe-testing</text>
</svg>
